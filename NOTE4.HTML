<!DOCTYPE html>
<HTML>
    <head>
        <style>
            .container {
                display: grid;
                grid: 150px/auto auto auto;
                grid-template-columns: repeat(7, 1fr);
                grid-gap: 10px;
            }
            .container > div {
                padding: 20px;
                background-color: #16877c;
                color: white;
                text-align: center;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
        </div>
    </body>
</HTML>
