<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    {
        box-sizing : border;
    }
.topnav{
    overflow:hidden;
    background-color:#333;
}    
.topnav a{
    float:left;
    display:block;
    color:#f2f2f2;
    text-align:center;
    padding:14px 16px;
    text-decoration:none;
    

}
.topnav a:hover{
    background-color:#ddd;
    color:black;
}
@media screen and (max-width:600px){
    .topnav a{
        float:none;
        width:100%;
    }
}
</style>    
</head>
<body>
<h2>Responsive Top Navigation</h2>
<p>resize the browser window to see the effect: when the screen is less than 600px, the navigation menu will be displayed vertically instead of horizontally.</p>
<div class="topnav">
    <a href="#">link</a>
    <a href="#">link</a>
    <a href="#">link</a>
    
</div>
</body>
</html>
