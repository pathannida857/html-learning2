<!DOCTYPE html>
 <html>
  <head>
<style>
div {
  
  width: 100px;
  height: 100px;
  background-color: red;
    transition: width 2x;
    transition-timing-function:liinear;
    
}
div:hover {
  width: 1200px;
  background-color: blue;
transition-property: width 2s;
    transition-timing-function:liinear;
}
</style>
</head>
<body>
<h1>CSS Transitions</h1>
<p>Hover over the div element below to see the effect.</p>
<div></div>
</body>
</html>
