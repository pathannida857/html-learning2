<!DOCTYPE html>
 <html>
  <head>
<style>
div {
  
  width: 100px;
  height: 100px;
  background-color: red;
    transition-property: width;
    transition-duration: 2s;
    transition-delay: 2s;
}
div:hover {
  width: 300px;
  height: 300px;
  background-color: rgb(200,255,0);
}
</style>
</head>
<body>
<h1>CSS Transitions</h1>
<p>Hover over the div element below to see the effect.</p>
<div></div>
</body>
</html>
