<!DOCTYPE html>
<html>
    <head>
        <style>
            .grid-container {
                display: grid;
                grid: 100px/auto auto auto;
                grid-gap: 15px;
                background-color: #2196f3;
                padding: 20px;
            }
            .grid-item > div{
                padding: 20px;
                background-color: #16877c;
                color:brown;
                text-align: center;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <h1> the gird property</h1>
        <p> the grid property is a shorthand for grid-template-rows, grid-template-columns, and grid-gap </p>
        <p> this gird layout has three colums ,and the first row is 150px tall</p>
        <div class="grid-container">
            <div class="grid-item">Item 1</div>
            <div class="grid-item">Item 2</div>
            <div class="grid-item">Item 3</div>
            <div class="grid-item">Item 4</div>
            <div class="grid-item">Item 5</div>
            <div class="grid-item">Item 6</div>
        </div>
    </body>
</html>
