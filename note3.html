<!DOCTYPE html>
<html>
    <style>
        .grid-container {
            display: grid;
            grid: 150px/auto auto auto;
            grid-template-columns: repeat(7, 1fr);
            grid-gap: 10px;
        }
        .grid-item {
            padding: 20px;
            background-color: #16877c;
            color: white;
            text-align: center;
            border-radius: 8px;
        }
    </style>
</html>
